<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Упражнение 13 — переключатели и флажки</title>
</head>
<body background="Фон.gif" bgcolor="#f2f2dc" text="#183d28" link="#0000cc" vlink="#551a8b" leftmargin="18" topmargin="12">
    <h1><font face="Arial">Упражнение 13. Переключатели и флажки</font></h1>
    <form>
        <p>Ваше имя:<br><input type="text" value="Участник похода"></p>
        <h2>Опыт походов</h2>
        <p><input type="radio" name="experience" value="first" checked> Первый поход<br>
           <input type="radio" name="experience" value="some"> Уже ходил в походы</p>
        <h2>Что интересно</h2>
        <p><input type="checkbox" name="interest" value="routes"> Маршруты<br>
           <input type="checkbox" name="interest" value="equipment"> Снаряжение<br>
           <input type="checkbox" name="interest" value="nature"> Природа</p>
        <p><input type="button" value="Обычная кнопка"></p>
        <p><input type="submit" value="Показать форму">
           <input type="reset" value="Сбросить форму"></p>
    </form>
    <p><a href="index.html">Вернуться к сайту</a></p>
</body>
</html>
