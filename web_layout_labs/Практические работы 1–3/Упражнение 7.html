<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Упражнение 7</title>
</head>
<body>
    <h2>Многоуровневый список</h2>
    <ol>
        <li>
            Нумерованный
            <ol>
                <li>Пункт 1</li>
                <li>Пункт 2</li>
                <li>Пункт 3</li>
            </ol>
        </li>
        <li>
            Маркированный
            <ul>
                <li>Первый вариант</li>
                <li>Второй вариант</li>
                <li>Третий вариант</li>
            </ul>
        </li>
        <li>
            Смешанный
            <ol type="a">
                <li>Пункт a</li>
                <li>Пункт b</li>
                <li>Пункт c</li>
            </ol>
        </li>
    </ol>
</body>
</html>
